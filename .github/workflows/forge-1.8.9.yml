name: Forge 1.8.9

on:
  push:
    paths:
      - 'forge-1.8.9/**'
      - '.github/workflows/forge-1.8.9.yml'
  pull_request:
    paths:
      - 'forge-1.8.9/**'
      - '.github/workflows/forge-1.8.9.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: forge-1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Build Forge 1.8.9 jar
        run: .\gradlew.bat clean build --no-daemon
      - name: Upload installable Forge mod
        uses: actions/upload-artifact@v4
        with:
          name: reglass-forge-1.8.9
          path: forge-1.8.9/build/libs/reglass-forge-1.8.9-*.jar
          if-no-files-found: error
